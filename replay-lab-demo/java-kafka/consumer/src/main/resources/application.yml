server:
  address: 127.0.0.1
  port: ${SERVER_PORT:18088}
spring:
  application:
    name: ledger-consumer
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_GROUP:quality-loop-ledger}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: true
demo:
  topic: ${KAFKA_TOPIC:quality-loop-transactions}
  listener-enabled: ${LISTENER_ENABLED:true}
  partner-url: ${PARTNER_API_URL:http://partner-api.test:8080}
jwt:
  secret: ${JWT_SECRET:banking-app-super-secret-key-change-this-in-production-256-bit}
management:
  endpoints:
    web:
      exposure:
        include: health
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
