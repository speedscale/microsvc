apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sidecar-mode variant of the speedscale overlay.
#
# Inherits the full speedscale overlay (responder TRs, observability, metrics
# services) and overrides the per-deployment annotation patches so each
# banking workload runs with the speedscale-goproxy sidecar injected at
# admission, instead of being routed to nettap (eBPF) by
# capture.speedscale.com/enabled. eBPF and sidecar injection are mutually
# exclusive in the operator (operator/webhook/admission.go), so flipping each
# workload requires removing the capture.speedscale.com/* annotations and
# adding the sidecar.speedscale.com/* ones.
#
# Used by staging-decoy, where we want goproxy in path so outbound rrpairs
# show up in the live tap and replays can compare per-request bodies.
# dev-decoy stays on the eBPF overlay.
#
# The Java workloads (accounts, transactions, gateway) also get
# sidecar.speedscale.com/tls-java-tool-options. Without the java agent, the JVM
# only trusts the goproxy MITM cert if it is pointed at the injected JKS. The
# operator surfaces those flags as SPEEDSCALE_JAVA_OPTS, but the base manifests
# launch with `exec java $JAVA_OPTS ...`, which never reads it, so every
# outbound HTTPS call (Plaid, Moody's, exchange rates) failed with PKIX and
# that traffic never reached goproxy. The annotation makes the operator fold
# the trust-store flags into JAVA_TOOL_OPTIONS, which the JVM honors on its own.

resources:
  - ../speedscale

patches:
  - target:
      kind: Deployment
      name: banking-ai
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"

  - target:
      kind: Deployment
      name: banking-gateway
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1java-agent
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-java-tool-options
        value: "true"

  - target:
      kind: Deployment
      name: banking-transactions
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1java-agent
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1ignore-ports
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-java-tool-options
        value: "true"

  - target:
      kind: Deployment
      name: banking-accounts
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1java-agent
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1ignore-ports
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-java-tool-options
        value: "true"

  - target:
      kind: Deployment
      name: banking-user
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1ignore-ports
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"

  - target:
      kind: Deployment
      name: banking-fraud
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"

  - target:
      kind: Deployment
      name: banking-notification
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"

  - target:
      kind: Deployment
      name: banking-frontend
    patch: |-
      - op: remove
        path: /metadata/annotations/capture.speedscale.com~1enabled
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1inject
        value: "true"
      - op: add
        path: /metadata/annotations/sidecar.speedscale.com~1tls-out
        value: "true"
